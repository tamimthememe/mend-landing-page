# Cloudflare Workers — Vite dist/ as static assets + thin pass-through worker.
name = "mend-landing-page"
main = "./worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /privacy → privacy.html (200); /privacy.html → 307 /privacy (once)
html_handling = "auto-trailing-slash"
# Unmatched navigations → index.html (SPA). Existing files always win first.
not_found_handling = "single-page-application"
